name: Subtree Split

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - directory: packages/core
            repository: persona-core
          - directory: packages/livewire
            repository: persona-livewire
          - directory: packages/inertia
            repository: persona-inertia
          - directory: packages/blade
            repository: persona-blade
          - directory: packages/api
            repository: persona-api

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split ${{ matrix.package.directory }}
        uses: symplify/monorepo-split-github-action@v2.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          package_directory: ${{ matrix.package.directory }}
          repository_organization: unknownman
          repository_name: ${{ matrix.package.repository }}
          user_name: unknownman
          user_email: unknownman@users.noreply.github.com
